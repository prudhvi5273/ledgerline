databases:
  - name: ledgerline-db
    databaseName: ledgerline_db
    user: ledger_user
    plan: free
    region: oregon

services:
  - type: web
    name: ledgerline-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerline-db
          property: connectionString
      - key: SYNC_DATABASE_URL
        fromDatabase:
          name: ledgerline-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://ledgerline.vercel.app,http://localhost:5173"
      - key: SYSTEM_CLEARING_ACCOUNT_ID
        value: "00000000-0000-0000-0000-000000000001"
